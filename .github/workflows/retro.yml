name: Retro compatibility tests

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  retro:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.23'

    - name: Start Redis
      uses: supercharge/redis-github-action@1.8.1

    - name: Run server
      run: cd tests && make server-start

    - name: Check server is alive
      run: |
        cd tests
        make server-status
        echo "--- server logs ---"
        cat logs/server.log || true

    - name: Run shared helper tests
      run: cd tests && make common-test

    - name: Run latest client tests
      run: cd tests && make client-run-latest

    - name: Run v0.23 client tests
      run: cd tests && make client-run-v0.23

    - name: Server logs
      run: cat tests/logs/server.log || true
      if: always()

    - name: Stop server
      run: cd tests && make server-stop
      if: always()
