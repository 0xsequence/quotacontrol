# Security updates only, grouped into one pull request per ecosystem.
# open-pull-requests-limit: 0 turns off routine version-update pull requests.
version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - "/"
      - "/tests/client/latest"
      - "/tests/client/v0.23"
      - "/tests/common"
      - "/tests/server"
      - "/tools"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns:
          - "*"
